[build-system]
requires = ["setuptools>=68.0,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feral"
version = "1.0.2"
description = "FERAL: Feature Extraction for Recognition of Animal Locomotion"
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = [
    "torch>=2.6.0",
    "pandas>=2.3,<4",
    "scikit-learn>=1.7,<2",
    "decord>=0.6.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "eva-decord>=0.6.0; sys_platform == 'darwin'",
    "triton-windows>=3.0; sys_platform == 'win32'",
    "transformers>=5.10.1,<6",
    "wandb>=0.25,<1",
    "timm>=1.0.26,<2",
    "einops>=0.8,<1",
    "hf_xet>=1.4,<2",
    "opencv-python>=4.13,<5",
    "matplotlib>=3.10,<4",
    "hf_transfer>=0.1.9,<1",
]

[project.urls]
Homepage = "https://getferal.ai"
Repository = "https://github.com/Skovorp/feral"

[project.scripts]
feral = "feral.cli:main"

[tool.setuptools.packages.find]
include = ["feral*"]

[tool.setuptools.package-data]
feral = ["default_config.yaml"]
